[project]
name = "feedback-analyzer"
version = "0.1.0"
description = "Generative AI customer feedback analyzer: FastAPI + OpenAI/Gemini backend with a Streamlit dashboard and SQLite history"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.136.3",
    "google-genai>=2.8.0",
    "openai>=1.66",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "streamlit>=1.58.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
